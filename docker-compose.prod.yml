# Production Docker Compose for AWS EC2 Deployment
# Usage: docker-compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build

services:
  # We do NOT run MongoDB in production via Docker. 
  # We use MongoDB Atlas (Cloud) for reliability and backups.
  mongo:
    profiles: ["disabled"] # This disables the local mongo container

  backend:
    depends_on:
      - redis
      - kafka
    restart: always

  vpay-consumer:
    restart: always

  frontend:
    # If deploying frontend to AWS Amplify, you can disable this container
    # profiles: ["disabled"]
    restart: always

volumes:
  huggingface_cache:
