services:
  - type: web
    name: medipulse-ml-engine
    env: python
    rootDir: medipulse-ranking-engine
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /v2/assessment
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.0
