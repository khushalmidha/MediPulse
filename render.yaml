services:
  - type: web
    name: medipulse-ml-engine
    env: python
    rootDir: medipulse-disease-prediction
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app -w 4 -k uvicorn.workers.UvicornWorker -b 0.0.0.0:$PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
